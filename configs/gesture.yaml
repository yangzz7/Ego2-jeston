camera: ../cameras/s200032/camera.yaml
inference_view:
  width: 640
  height: 640
  hfov: 105
  yaw: 0
  pitch: -15
gesture:
  # Jetson: GPU detection/landmarks; auto falls back to CPU on runtime errors.
  backend: auto
  model: ../models/gesture_recognizer.task
  num_hands: 2
  detection_confidence: 0.5
  presence_confidence: 0.5
  tracking_confidence: 0.5
  gesture_confidence: 0.6
  # Per-track Left/Right confirmation; no frame buffering or landmark delay.
  handedness_confidence: 0.65
  handedness_confirm_ms: 250
  handedness_initial_window_ms: 1000
  handedness_switch_confidence: 0.85
  handedness_switch_ms: 500
  smoothing_ms: 35
  confirm_ms: 120
  track_timeout_ms: 300
  # Confirmed tracks only: bounded identity recovery with strict palm matching.
  track_reacquire_ms: 650
  association_distance: 0.18
  pinch_enter: 0.25
  pinch_exit: 0.38
  released_ms: 250
viewer:
  memory_limit: 1GiB
  jpeg_quality: 95
