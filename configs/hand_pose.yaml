# Physical marker parameters are shared separately from this runtime profile.
marker_config: ../calibration_targets/wrist_tags.yaml
camera: ../cameras/s200032/camera.yaml
reference: cam1
# Defaults to cameras/<selected SN>/wrist_bundles.json; generated by calibrate.
# Optional bundle_calibration or --bundle-calibration overrides this location.
bundle_calibration_quality:
  min_samples: 15
  min_span_s: 1.0
  max_translation_m: 0.006
  max_rotation_deg: 12
bundle_fusion:
  max_translation_m: 0.012
  max_rotation_deg: 15
detection_view:
  # Supersampling helps decode the historical small, two-cell-border tags.
  # It does not add optical resolution or imply better metric accuracy.
  width: 1920
  height: 1536
  hfov: 100
  yaw: 0
  pitch: -15
quality:
  require_stereo: true
  min_side_px: 20
  max_reprojection_px: 2.5
  min_distance_m: 0.12
  max_distance_m: 1.5
  ambiguity_px: 0.15
  ambiguity_angle_deg: 15
tracking:
  smoothing_ms: 40
  max_gap_s: 0.2
  max_speed_m_s: 3
  max_angular_speed_deg_s: 720
  jump_slack_m: 0.03
  jump_slack_deg: 15
  trajectory_points: 1800
  pose_history_count: 80
  pose_history_interval_s: 0.3
viewer:
  memory_limit: 1GiB
  axis_length_m: 0.035
